server {
    listen 80;
    server_name hackathon.rucmakers.club;
    location ^~ /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://hackathon.rucmakers.club$request_uri; }
}
server {
    listen 443 ssl http2;
    server_name hackathon.rucmakers.club;
    ssl_certificate /etc/letsencrypt/live/hackathon.rucmakers.club/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hackathon.rucmakers.club/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:RucSSL:10m;
    ssl_session_timeout 1d;
    server_tokens off;
    client_max_body_size 600m;
    client_body_timeout 120s;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_request_buffering off;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    location = / { return 302 /hackathon/; }
    location /static/ { alias /srv/ruc-makers/src/app/eventyay/static.dist/; access_log off; }
    location /media/ { alias /srv/ruc-makers/src/app/eventyay/data/media/; }
    location /ws/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
    location / { proxy_pass http://127.0.0.1:8000; }
}
