# Optional isolated service: never point this at an existing production bucket.
services:
  minio:
    image: ruc-minio-test:source-0d7408fc
    build:
      context: ..
      dockerfile: deployment/Dockerfile.minio-test
    profiles: [storage-test]
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set a test access key}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set a test secret}
    ports: ['127.0.0.1:9000:9000']
    volumes: [minio-test:/data]
volumes:
  minio-test:
