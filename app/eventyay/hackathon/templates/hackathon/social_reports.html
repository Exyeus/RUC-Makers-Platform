{% extends 'hackathon/base.html' %}{% block content %}<h1>{{ title }}</h1>{% for report in reports %}<article class="panel"><p>{{ report.reporter.name }} · {{ report.target_type }} · {{ report.target_id }}</p><p>{{ report.reason }}</p><form method="post">{% csrf_token %}<input type="hidden" name="report_id" value="{{ report.pk }}"><button>标记已处理</button></form></article>{% empty %}<p>暂无待处理举报。</p>{% endfor %}{% endblock %}
