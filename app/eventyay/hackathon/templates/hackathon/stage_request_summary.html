<section class="panel"><div class="section-heading"><h2>选手时段与顺序诉求</h2><a class="button secondary" href="{% url 'hackathon:stage-requests-manage' hackathon.slug %}">处理顺序申请（{{ stage_request_pending }} 条待处理）</a></div><p>个人缺席时段仅供现场核对。调整顺序须先核查申请人的原因和证明，并在申请页保存实际安排及回执。</p>
{% if stage_attendance %}<details><summary>查看已填报的缺席时段与特殊安排</summary><div class="table-panel"><table><thead><tr><th>队伍</th><th>选手</th><th>缺席时段 / 特殊安排</th></tr></thead><tbody>{% for person in stage_attendance %}<tr><td>{{ person.team }}</td><td>{{ person.name }}</td><td>{{ person.summary }}</td></tr>{% endfor %}</tbody></table></div></details>{% else %}<p>尚无选手填报特殊时段。</p>{% endif %}
</section>
