name: Feishu notifications

on:
  issues:
    types: [opened, edited, assigned]
  # Secrets are available for fork PRs; execute only the trusted default-branch code.
  pull_request_target:
    types: [opened, edited, review_requested]
  issue_comment:
    types: [created, edited]
  workflow_dispatch:
    inputs:
      mention_user:
        description: "可选：测试 @ 提醒的 GitHub 用户名（不含 @，需配置 FEISHU_USER_MAP）"
        required: false
        type: string

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Send notification to Feishu
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_CHAT_ID: ${{ secrets.FEISHU_CHAT_ID }}
          FEISHU_USER_MAP: ${{ secrets.FEISHU_USER_MAP }}
        run: python .github/scripts/feishu_notify.py
